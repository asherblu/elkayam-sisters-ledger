<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>חשבונות בין האחיות - משפחת אלקיים</title>

<style>
  :root {
    --bg: #f4f2ee;
    --card: #ffffff;
    --border: #e2ddd3;
    --text: #2c2a26;
    --text-muted: #8a8578;
    --ricky: #b7562f;
    --bruria: #2f6a55;
    --dorit: #35578f;
    --owed-to-me: #1f7a4d;
    --i-owe: #b23b3b;
    --accent: #8a6d3b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px; padding-bottom: 60px; }
  .banner {
    background: #eaf3de;
    border: 1px solid #c0dd97;
    color: #27500a;
    font-size: 12.5px;
    padding: 8px 12px;
    border-radius: 10px;
    margin-bottom: 16px;
    text-align: center;
  }
  h1 { font-size: 20px; margin: 8px 0 2px; text-align: center; }
  .sub { text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }

  .name-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 16px; }
  .name-btn {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; cursor: pointer; font-size: 16px; color: var(--text); text-align: right;
  }
  .name-btn.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(138,109,59,0.15); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; flex-shrink: 0; }
  .avatar.ricky { background: var(--ricky); }
  .avatar.bruria { background: var(--bruria); }
  .avatar.dorit { background: var(--dorit); }

  label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
  input, select, textarea {
    width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 15px; background: #fff; color: var(--text); font-family: inherit;
  }
  textarea { resize: vertical; min-height: 64px; }
  .field { margin-bottom: 12px; }
  .btn {
    width: 100%; padding: 12px; border-radius: 10px; border: none; font-size: 15px;
    font-weight: 600; cursor: pointer;
  }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: var(--i-owe); color: #fff; }
  .btn-small { padding: 8px 12px; font-size: 13px; width: auto; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }

  .error { color: var(--i-owe); font-size: 13px; margin-top: 6px; text-align: center; }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .topbar .who { display: flex; align-items: center; gap: 10px; }
  .topbar h1 { margin: 0; font-size: 18px; text-align: right; }
  .link-btn { background: none; border: none; color: var(--accent); font-size: 13px; cursor: pointer; padding: 4px; }

  .account-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; margin-bottom: 12px; cursor: pointer;
  }
  .account-card .top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .account-card .name { font-size: 16px; font-weight: 600; }
  .balance-line { font-size: 15px; }
  .balance-line.owed-to-me { color: var(--owed-to-me); font-weight: 600; }
  .balance-line.i-owe { color: var(--i-owe); font-weight: 600; }
  .balance-line.even { color: var(--text-muted); }

  .back-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .back-row button { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text); padding: 4px 8px; }

  .balance-hero { text-align: center; padding: 18px 10px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 16px; }
  .balance-hero .amount { font-size: 30px; font-weight: 700; margin: 4px 0; }
  .balance-hero .amount.owed-to-me { color: var(--owed-to-me); }
  .balance-hero .amount.i-owe { color: var(--i-owe); }
  .balance-hero .amount.even { color: var(--text-muted); }
  .balance-hero .caption { font-size: 13px; color: var(--text-muted); }

  .toggle-add { margin-bottom: 12px; }
  .add-form { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .add-form h3 { margin: 0 0 12px; font-size: 15px; }
  .type-toggle { display: flex; gap: 8px; margin-bottom: 12px; }
  .type-toggle button {
    flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
    background: #fff; cursor: pointer; font-size: 14px; color: var(--text-muted);
  }
  .type-toggle button.active.charge { background: #fbeceb; border-color: var(--i-owe); color: var(--i-owe); font-weight: 600; }
  .type-toggle button.active.repayment { background: #e8f5ee; border-color: var(--owed-to-me); color: var(--owed-to-me); font-weight: 600; }

  .tx-list { display: flex; flex-direction: column; gap: 8px; }
  .tx-item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .tx-item .tx-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .tx-item .tx-amount { font-weight: 600; font-size: 15px; }
  .tx-item .tx-amount.charge { color: var(--i-owe); }
  .tx-item .tx-amount.repayment { color: var(--owed-to-me); }
  .tx-item .tx-meta { font-size: 12px; color: var(--text-muted); }
  .tx-item .tx-desc { font-size: 13.5px; margin-top: 4px; }
  .tx-item .tx-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .del-btn { background: none; border: none; color: var(--text-muted); font-size: 12px; cursor: pointer; text-decoration: underline; }
  .empty { text-align: center; color: var(--text-muted); font-size: 14px; padding: 30px 0; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .modal-box { background: #fff; border-radius: 14px; padding: 20px; max-width: 340px; width: 100%; }
  .modal-box p { font-size: 15px; margin: 0 0 16px; }

  .footer-actions { display: flex; gap: 8px; margin-top: 24px; }
  .footer-actions button { flex: 1; font-size: 12.5px; }

  .bills-wrap { position: relative; height: 100px; margin: 4px 0 16px; }
  .bill {
    position: absolute; width: 92px; height: 56px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.55);
    display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
  }
  .bill .sign { font-size: 22px; font-weight: 700; line-height: 1; }
  .bill .denom { font-size: 10px; font-weight: 600; opacity: 0.9; margin-top: 2px; }
  .bill.b200 { background: #5c4b8a; top: 6px; left: 4px; transform: rotate(-8deg); z-index: 1; }
  .bill.b100 { background: #c07120; top: 30px; left: 94px; transform: rotate(6deg); z-index: 3; }
  .bill.b50  { background: #8a3b6b; top: 2px; left: 184px; transform: rotate(-5deg); z-index: 2; }
  .bill.b20  { background: #1f8f7a; top: 34px; left: 274px; transform: rotate(10deg); z-index: 2; }

  .popup-box { text-align: center; }
  .popup-box .popup-text { font-size: 18px; font-weight: 600; margin: 4px 0 18px; line-height: 1.5; }

  .tx-item.deleted-log { border-color: var(--i-owe); }
  .notes-toggle { margin-top: 20px; }

  .badge-new {
    margin-inline-start: auto; background: var(--i-owe); color: #fff; font-size: 11px;
    font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap;
  }
  .popup-notif-list { margin-bottom: 16px; }
  .popup-notif { font-size: 14px; background: var(--bg); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; line-height: 1.4; }

  .loading-wrap { text-align: center; padding: 60px 10px; color: var(--text-muted); font-size: 15px; }

  .hero-buttons { display: flex; gap: 14px; margin-bottom: 18px; }
  .btn-3d {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 16px 10px; border: none; border-radius: 18px; cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 700; color: #fff;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .btn-3d .icon-circle {
    width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 22px; background: rgba(255,255,255,0.25);
  }
  .btn-3d.empower {
    background: linear-gradient(145deg, #e07bb0, #c94f8f);
    box-shadow: 0 5px 0 #a03a70, 0 8px 14px rgba(160,58,112,0.35);
  }
  .btn-3d.empower:active { transform: translateY(4px); box-shadow: 0 1px 0 #a03a70, 0 2px 6px rgba(160,58,112,0.3); }
  .btn-3d.recipes {
    background: linear-gradient(145deg, #4fa377, #2f7a55);
    box-shadow: 0 5px 0 #1f5a3d, 0 8px 14px rgba(31,90,61,0.35);
  }
  .btn-3d.recipes:active { transform: translateY(4px); box-shadow: 0 1px 0 #1f5a3d, 0 2px 6px rgba(31,90,61,0.3); }

  .popup-quote { font-size: 13.5px; color: var(--accent); background: var(--bg); border-radius: 10px; padding: 10px 12px; margin: 4px 0 14px; line-height: 1.5; }

  .category-group { margin-bottom: 14px; }
  .category-header {
    display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 14.5px;
  }
  .category-header .chev { margin-inline-start: auto; transition: transform 0.15s; font-size: 12px; color: var(--text-muted); }
  .category-header.open .chev { transform: rotate(180deg); }
  .category-body { padding: 10px 4px 0; display: flex; flex-direction: column; gap: 8px; }
  .recipe-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
  .recipe-card .recipe-title { font-weight: 600; font-size: 14.5px; }
  .recipe-card .recipe-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .recipe-detail { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 10px; font-size: 13.5px; }
  .recipe-detail h4 { margin: 10px 0 6px; font-size: 13px; color: var(--accent); }
  .recipe-detail h4:first-child { margin-top: 0; }
  .recipe-detail ul, .recipe-detail ol { margin: 0 0 6px; padding-inline-start: 20px; }
  .recipe-detail li { margin-bottom: 4px; }
  .ing-row, .step-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
  .ing-row input, .step-row input { flex: 1; }
  .row-remove-btn { background: none; border: none; color: var(--i-owe); font-size: 18px; cursor: pointer; padding: 4px 8px; flex-shrink: 0; }
  .row-add-btn { background: var(--bg); border: 1px dashed var(--border); border-radius: 8px; padding: 8px; font-size: 13px; color: var(--text-muted); cursor: pointer; width: 100%; margin-bottom: 4px; }

  .app-version-footer { text-align: center; font-size: 11px; color: var(--text-muted); opacity: 0.75; margin-top: 26px; line-height: 1.6; }

  .fab-col { position: fixed; z-index: 40; display: flex; flex-direction: column; gap: 14px; bottom: 90px; }
  .fab-col.right { right: 16px; }
  .fab-circle {
    width: 62px; height: 62px; border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 26px; color: #fff;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .fab-circle.joke-fab { background: linear-gradient(145deg, #ffd166, #f0a500); box-shadow: 0 5px 0 #b87700, 0 8px 14px rgba(184,119,0,0.35); }
  .fab-circle.joke-fab:active { transform: translateY(4px); box-shadow: 0 1px 0 #b87700, 0 2px 6px rgba(184,119,0,0.3); }
  .fab-circle.empower-fab { background: linear-gradient(145deg, #e07bb0, #c94f8f); box-shadow: 0 5px 0 #a03a70, 0 8px 14px rgba(160,58,112,0.35); }
  .fab-circle.empower-fab:active { transform: translateY(4px); box-shadow: 0 1px 0 #a03a70, 0 2px 6px rgba(160,58,112,0.3); }

  .sticky-note-tab {
    position: fixed; left: 0; top: 50%; transform: translateY(-50%); z-index: 40;
    background: #fff4a3; border: 1px solid #e6d366; border-inline-start: none;
    border-radius: 0 12px 12px 0; padding: 14px 8px; box-shadow: 2px 3px 8px rgba(0,0,0,0.18);
    cursor: pointer; writing-mode: vertical-rl; text-orientation: mixed; font-size: 13px; font-weight: 700; color: #6b5a10;
  }

  .joke-modal .joke-text, .empower-modal .empower-text { font-size: 17px; font-weight: 600; line-height: 1.6; text-align: center; margin: 6px 0 18px; }
  .empower-modal .empower-text { color: var(--accent); }
  .star-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; direction: ltr; }
  .star-row .star { font-size: 30px; cursor: pointer; color: #ddd; line-height: 1; }
  .star-row .star.filled { color: #f5b400; }
  .joke-reactions { display: flex; flex-direction: column; gap: 6px; margin: 4px 0 16px; }
  .joke-reaction { font-size: 13px; background: var(--bg); border-radius: 8px; padding: 8px 10px; }
  .joke-reaction .stars-mini { color: #f5b400; letter-spacing: 1px; }
  .modal-actions { display: flex; gap: 8px; }
  .my-rating-caption { text-align: center; font-size: 13px; color: var(--text-muted); margin: 0 0 14px; }

  .shopping-modal { max-width: 400px; }
  .shopping-add-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .shopping-add-row input { flex: 1; }
  .shopping-list { display: flex; flex-direction: column; gap: 8px; max-height: 50vh; overflow-y: auto; }
  .shopping-item { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .shopping-item.purchased { opacity: 0.65; }
  .shopping-item .avatar { width: 28px; height: 28px; font-size: 12px; flex-shrink: 0; }
  .shopping-item .item-body { flex: 1; min-width: 0; }
  .shopping-item .item-text { font-size: 14.5px; word-break: break-word; }
  .shopping-item.purchased .item-text { text-decoration: line-through; color: var(--text-muted); }
  .shopping-item .item-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .buy-check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border); background: #fff; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; color: transparent; padding: 0; }
  .shopping-item.purchased .buy-check { background: var(--owed-to-me); border-color: var(--owed-to-me); color: #fff; }
  .del-item-btn { background: none; border: none; color: var(--text-muted); font-size: 17px; cursor: pointer; flex-shrink: 0; padding: 2px 4px; }
</style>
</head>

function isoWeekKey(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  const week = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
  return `${date.getUTCFullYear()}-W${week}`;
}

function simpleHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = (h * 31 + str.charCodeAt(i)) >>> 0; }
  return h;
}

// Once a week, exactly one quote "slot" in the pool is swapped for a rotating Asher joke —
// same swapped slot and same joke for everyone all week (deterministic by ISO week), not random per view.
function quotePoolWithWeeklyAsherJoke() {
  const pool = EMPOWERMENT_QUOTES.concat(data.empowermentQuotes.map(q => q.text));
  if (!pool.length || !ASHER_JOKES.length) return pool;
  const h = simpleHash(isoWeekKey(new Date()));
  const slotIndex = h % pool.length;
  const jokeIndex = h % ASHER_JOKES.length;
  const result = pool.slice();
  result[slotIndex] = ASHER_JOKES[jokeIndex];
  return result;
}

function fmtMoney(n) {
  return Math.round(Math.abs(n) * 100) / 100;
}

function todayStr() {

}

function fmtDate(iso) {
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function fmtDateTime(iso) {
  const d = new Date(iso);
  const hh = d.getHours().toString().padStart(2, '0');
  const mm = d.getMinutes().toString().padStart(2, '0');
  return `${fmtDate(iso.slice(0, 10))} ${hh}:${mm}`;
}

function computeBalance(me, other) {
  let net = 0;
  for (const tx of data.transactions) {
    if (tx.payer === me && tx.payee === other) {
      net += tx.type === 'charge' ? tx.amount : -tx.amount;
    } else if (tx.payer === other && tx.payee === me) {
      net += tx.type === 'charge' ? -tx.amount : tx.amount;
    }
  }
  return Math.round(net * 100) / 100;
}

function balanceLabel(me, other, net) {
  if (net > 0.001) return { text: `את חייבת ל${other} ${fmtMoney(net)} ₪`, cls: 'i-owe' };
  if (net < -0.001) return { text: `${other} חייבת לך ${fmtMoney(net)} ₪`, cls: 'owed-to-me' };
  return { text: 'מאוזן', cls: 'even' };
}

function getPairTransactions(a, b) {
  return data.transactions
    .filter(tx => (tx.payer === a && tx.payee === b) || (tx.payer === b && tx.payee === a))
    .sort((x, y) => (y.date + y.createdAt).localeCompare(x.date + x.createdAt));
}

function renderTxItem(tx) {
  const me = session.name;
  const payerText = tx.payer === me ? 'את' : tx.payer;
  const payeeText = tx.payee === me ? 'לך' : `ל${tx.payee}`;
  const typeLabel = tx.type === 'charge' ? 'חיוב כפרה' : 'החזר כפרה';
  const directionText = tx.type === 'charge'
    ? `${payerText} חייבת ${payeeText}`
    : `${payerText} שילמה ${payeeText}`;
  return `
    <div class="tx-item">
      <div class="tx-top">
        <span class="tx-amount ${tx.type}">${typeLabel} — ${fmtMoney(tx.amount)} ₪</span>
        <span class="tx-meta">${fmtDate(tx.date)}</span>
      </div>
      <div class="tx-meta">${directionText}</div>
      ${tx.description ? `<div class="tx-desc">${escapeHtml(tx.description)}</div>` : ''}
      <div class="tx-bottom">
        <span class="tx-meta">נרשם ע"י ${tx.enteredBy}</span>
        <button class="del-btn" data-delete-tx="${tx.id}">מחיקה</button>
      </div>
    </div>
  `;
}

function renderLog() {
  const me = session.name;
  const entries = data.activityLog
    .filter(e => e.pairA === me || e.pairB === me)
    .slice()
    .sort((a, b) => b.timestamp.localeCompare(a.timestamp));

  return `
    <div class="back-row">
      <button class="btn btn-secondary btn-small" id="back-to-dash-from-log">→ חזרה</button>
      <h1 style="margin:0; font-size:17px;">יומן פעולות</h1>
    </div>
    <div class="tx-list">
      ${entries.length === 0 ? '<div class="empty">אין עדיין פעולות ביומן</div>' : entries.map(e => renderLogItem(e, me)).join('')}
    </div>
  `;
}

function renderLogItem(e, me) {
  const other = e.pairA === me ? e.pairB : e.pairA;
  const typeLabel = e.tx.type === 'charge' ? 'חיוב' : 'החזר';
  if (e.action === 'add') {
    return `
      <div class="tx-item">
        <div class="tx-top">
          <span class="tx-amount ${e.tx.type}">הוספת ${typeLabel} — ${fmtMoney(e.tx.amount)} ₪</span>
          <span class="tx-meta">${fmtDateTime(e.timestamp)}</span>
        </div>
        <div class="tx-meta">${e.performedBy} רשמה מול ${other}</div>
        ${e.tx.description ? `<div class="tx-desc">${escapeHtml(e.tx.description)}</div>` : ''}
      </div>
    `;
  }
  return `
    <div class="tx-item deleted-log">
      <div class="tx-top">
        <span class="tx-amount ${e.tx.type}">נמחק ${typeLabel} — ${fmtMoney(e.tx.amount)} ₪</span>
        <span class="tx-meta">${fmtDateTime(e.timestamp)}</span>
      </div>
      <div class="tx-meta">${e.performedBy} מחקה רישום מול ${other} (נרשם במקור ע"י ${e.tx.enteredBy}, בתאריך ${fmtDate(e.tx.date)})</div>
      ${e.tx.description ? `<div class="tx-desc">${escapeHtml(e.tx.description)}</div>` : ''}
    </div>
  `;
}

function recipeCategoryList() {

function renderRecipes() {
  const cats = recipeCategoryList();
  const grouped = {};
  data.recipes.forEach(r => {
    const c = r.category || 'ללא קטגוריה';
    if (!grouped[c]) grouped[c] = [];
    grouped[c].push(r);
  });
  const allCatNames = new Set(cats);
  Object.keys(grouped).forEach(c => allCatNames.add(c));
  const orderedCats = Array.from(allCatNames).sort((a, b) => a.localeCompare(b, 'he'));

  return `
    <div class="back-row">
      <button class="btn btn-secondary btn-small" id="back-to-dash-from-recipes">→ חזרה</button>
      <h1 style="margin:0; font-size:17px;">מתכונים משותפים</h1>
    </div>
    <button class="btn btn-primary toggle-add" id="toggle-add-recipe-btn">${view.showAddRecipe ? 'סגירת טופס' : '+ הוספת מתכון'}</button>
    ${view.showAddRecipe ? renderAddRecipeForm(cats) : ''}
    ${orderedCats.length === 0 ? `<div class="empty">אין עדיין מתכונים - תהיי הראשונה להוסיף!</div>` : orderedCats.map(cat => renderCategoryGroup(cat, grouped[cat] || [])).join('')}
  `;
}

function renderCategoryGroup(cat, recipes) {
  const isOpen = !!(view.openRecipeCategories && view.openRecipeCategories[cat]);
  return `

      <div class="category-header ${isOpen ? 'open' : ''}" data-toggle-category="${escapeHtml(cat)}">
        <span>📁 ${escapeHtml(cat)}</span>
        <span class="tx-meta">(${recipes.length})</span>
        <span class="chev">▾</span>

      ${isOpen ? `
        <div class="category-body">
          ${recipes.length === 0 ? `<div class="empty">אין מתכונים בקטגוריה זו</div>` : recipes.map(r => renderRecipeCard(r)).join('')}
        </div>

    </div>
  `;
}

function renderRecipeCard(r) {
  const isOpen = !!(view.openRecipes && view.openRecipes[r.id]);

      ${isOpen ? `
        <div class="recipe-detail">
          ${(r.ingredients || []).length ? `<h4>מרכיבים</h4><ul>${(r.ingredients || []).map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul>` : ''}
          ${(r.instructions || []).length ? `<h4>אופן ההכנה</h4><ol>${(r.instructions || []).map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ol>` : ''}
          ${r.notes ? `<h4>הערות</h4><div>${escapeHtml(r.notes)}</div>` : ''}
          <div class="tx-bottom" style="margin-top:10px;">
            <span></span>
            <button class="del-btn" data-delete-recipe="${r.id}">מחיקה</button>
          </div>
        </div>
      ` : ''}
    </div>
  `;
}

function jokeStarPhrase(stars) {
  return JOKE_STAR_PHRASES[stars] || '';
}

function renderJokeModal() {
  const idx = view.jokePopup.index;
  const joke = JOKES[idx];
  const myRating = data.jokeRatings.find(r => r.jokeIndex === idx && r.sister === session.name);
  const myStars = myRating ? myRating.stars : 0;
  const others = data.jokeRatings.filter(r => r.jokeIndex === idx && r.sister !== session.name && r.stars > 0);
  return `
    <div class="modal-overlay" id="joke-modal-overlay">
      <div class="modal-box joke-modal">
        <div class="joke-text">😂 ${escapeHtml(joke)}</div>
        <div class="star-row" id="joke-star-row">
          ${[1, 2, 3, 4, 5].map(n => `<span class="star ${n <= myStars ? 'filled' : ''}" data-star="${n}">★</span>`).join('')}
        </div>
        ${myStars ? `<div class="my-rating-caption">${escapeHtml(jokeStarPhrase(myStars))}</div>` : ''}
        ${others.length ? `
          <div class="joke-reactions">
            ${others.map(r => `<div class="joke-reaction"><span class="stars-mini">${'★'.repeat(r.stars)}</span> ${escapeHtml(r.sister)} ${escapeHtml(jokeStarPhrase(r.stars))}</div>`).join('')}
          </div>
        ` : ''}
        <div class="modal-actions">
          <button class="btn btn-secondary" id="joke-next-btn">בדיחה הבאה</button>
          <button class="btn btn-primary" id="joke-close-btn">סגירה</button>
        </div>
      </div>
    </div>
  `;
}

function shoppingSortedList() {
  const list = data.shoppingList.slice();
  list.sort((a, b) => {
    if (!!a.purchased !== !!b.purchased) return a.purchased ? 1 : -1;
    if (a.purchased) return (a.purchasedAt || '').localeCompare(b.purchasedAt || '');
    return (a.createdAt || '').localeCompare(b.createdAt || '');
  });
  return list;
}

function attachHandlers() {
  document.querySelectorAll('[data-select-name]').forEach(el => {
    el.onclick = () => {
      view.selectedName = el.getAttribute('data-select-name');
      view.loginError = '';
      view.showChangePw = false;
      render();
    };
  });

  const loginBtn = document.getElementById('login-btn');
  if (loginBtn) {
    loginBtn.onclick = async () => {
      const pw = document.getElementById('password-input').value;
      loginBtn.disabled = true;
      try {
        await signInWithEmailAndPassword(auth, EMAIL_MAP[view.selectedName], pw);
      } catch (e) {
        view.loginError = 'סיסמה שגויה, נסי שוב';
        render();
      }
    };
    const pwInput = document.getElementById('password-input');
    pwInput.onkeydown = (e) => { if (e.key === 'Enter') loginBtn.click(); };
  }

  const showChangePw = document.getElementById('show-change-pw');
  if (showChangePw) showChangePw.onclick = () => { view.showChangePw = !view.showChangePw; view.pwError = ''; render(); };

  const savePwBtn = document.getElementById('save-pw-btn');
  if (savePwBtn) {
    savePwBtn.onclick = async () => {
      const cur = document.getElementById('cur-pw').value;
      const nw = document.getElementById('new-pw').value;
      if (!nw || nw.length < 6) {
        view.pwError = 'סיסמה חדשה חייבת לפחות 6 תווים';
        render();
        return;
      }
      savePwBtn.disabled = true;
      suppressAuthUI = true;
      try {
        await signInWithEmailAndPassword(auth, EMAIL_MAP[view.selectedName], cur);
        await updatePassword(auth.currentUser, nw);
        await signOut(auth);
        view.showChangePw = false;
        view.pwError = '';
        view.loginError = 'הסיסמה עודכנה, אפשר להתחבר';
      } catch (e) {
        view.pwError = 'הסיסמה הנוכחית שגויה';
      }
      suppressAuthUI = false;
      render();
    };
  }

  const logoutBtn = document.getElementById('logout-btn');
  if (logoutBtn) logoutBtn.onclick = async () => {
    const farewellText = getFarewellText();
    suppressAuthUI = true;
    unsubscribeAll();
    await signOut(auth);
    session = null;
    view = { screen: 'farewell', farewellText };
    render();
  };

  const closeLoginPopup = document.getElementById('close-login-popup');
  if (closeLoginPopup) closeLoginPopup.onclick = () => { view.loginPopup = null; render(); };

  const farewellOkBtn = document.getElementById('farewell-ok-btn');
  if (farewellOkBtn) farewellOkBtn.onclick = () => {
    suppressAuthUI = false;
    view = { screen: 'login', selectedName: null, loginError: '' };
    render();
  };

  document.querySelectorAll('[data-open-account]').forEach(el => {
    el.onclick = () => {
      view.activeAccount = el.getAttribute('data-open-account');
      view.screen = 'account';
      view.showAddForm = false;
      view.showNotes = false;
      view.addType = 'charge';
      view.addError = '';
      render();
    };
  });

  const backBtn = document.getElementById('back-to-dash');
  if (backBtn) backBtn.onclick = () => { view.screen = 'dashboard'; render(); };

  const openNotesBtn = document.getElementById('open-notes-btn');
  if (openNotesBtn) openNotesBtn.onclick = () => { view.screen = 'personalNotes'; render(); };

  const openLogBtn = document.getElementById('open-log-btn');
  if (openLogBtn) openLogBtn.onclick = () => { view.screen = 'log'; render(); };

  const backFromLog = document.getElementById('back-to-dash-from-log');

  const backFromNotes = document.getElementById('back-to-dash-from-notes');

  const toggleNotesBtn = document.getElementById('toggle-notes-btn');
  if (toggleNotesBtn) toggleNotesBtn.onclick = () => {

  };

  const savePersonalNoteBtn = document.getElementById('save-personal-note-btn');

      savePersonalNoteBtn.disabled = false;

  const saveSharedNoteBtn = document.getElementById('save-shared-note-btn');

      saveSharedNoteBtn.disabled = true;

        await addDoc(collection(db, 'sharedNotes'), { pairKey: pairKey(me, other), author: me, text, createdAt: new Date().toISOString() });

      }
      saveSharedNoteBtn.disabled = false;

  document.querySelectorAll('[data-delete-note]').forEach(el => {

  document.querySelectorAll('[data-set-type]').forEach(el => {
    el.onclick = () => { view.addType = el.getAttribute('data-set-type'); render(); };
  });

  const saveTxBtn = document.getElementById('save-tx-btn');
  if (saveTxBtn) {
    saveTxBtn.onclick = async () => {
      const me = session.name;
      const other = view.activeAccount;
      const direction = document.getElementById('direction-select').value;
      const amount = parseFloat(document.getElementById('amount-input').value);
      const description = document.getElementById('desc-input').value.trim();
      const date = document.getElementById('date-input').value || todayStr();

      if (!amount || amount <= 0) {
        view.addError = 'יש להזין סכום תקין';
        render();
        return;
      }

      const payer = direction === 'me' ? me : other;
      const payee = direction === 'me' ? other : me;
      const newTx = {
        payer, payee,
        type: view.addType,
        amount: Math.round(amount * 100) / 100,
        description,
        date,
        enteredBy: me,
        createdAt: new Date().toISOString()
      };

      view.showAddForm = false;
      view.addError = '';
      render();

      try {
        const txRef = await addDoc(collection(db, 'transactions'), newTx);
        await Promise.all([
          markTxSeen(me, txRef.id),
          addDoc(collection(db, 'activityLog'), {
            action: 'add',
            performedBy: me,
            pairA: me, pairB: other,
            timestamp: new Date().toISOString(),
            tx: { type: newTx.type, amount: newTx.amount, description: newTx.description, date: newTx.date, enteredBy: newTx.enteredBy }
          })
        ]);
      } catch (e) {
        alert('שגיאה בשמירת הרישום, נסי שוב');
      }
    };
  }

  document.querySelectorAll('[data-delete-tx]').forEach(el => {
    el.onclick = () => { pendingDelete = el.getAttribute('data-delete-tx'); render(); };

  if (cancelDelete) cancelDelete.onclick = () => { pendingDelete = null; render(); };

  const confirmDelete = document.getElementById('confirm-delete');
  if (confirmDelete) confirmDelete.onclick = async () => {
    const deletedTx = data.transactions.find(tx => tx.id === pendingDelete);
    const idToDelete = pendingDelete;
    pendingDelete = null;
    render();
    if (deletedTx) {
      try {
        await deleteDoc(doc(db, 'transactions', idToDelete));
        await addDoc(collection(db, 'activityLog'), {
          action: 'delete',
          performedBy: session.name,
          pairA: deletedTx.payer, pairB: deletedTx.payee,
          timestamp: new Date().toISOString(),
          tx: { type: deletedTx.type, amount: deletedTx.amount, description: deletedTx.description, date: deletedTx.date, enteredBy: deletedTx.enteredBy }
        });
      } catch (e) {
        alert('שגיאה במחיקת הרישום');
      }
    }
  };

  const exportBtn = document.getElementById('export-btn');
  if (exportBtn) exportBtn.onclick = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `elkayam-ledger-backup-${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const openEmpowermentBtn = document.getElementById('open-empowerment-btn');
  if (openEmpowermentBtn) openEmpowermentBtn.onclick = () => {
    view.screen = 'empowerment';
    view.showAddQuote = false;
    view.addQuoteError = '';
    render();
  };

  const backFromEmpower = document.getElementById('back-to-dash-from-empower');
  if (backFromEmpower) backFromEmpower.onclick = () => { view.screen = 'dashboard'; render(); };

  const toggleAddQuoteBtn = document.getElementById('toggle-add-quote-btn');
  if (toggleAddQuoteBtn) toggleAddQuoteBtn.onclick = () => {
    view.showAddQuote = !view.showAddQuote;
    view.addQuoteError = '';
    render();
  };

  const saveQuoteBtn = document.getElementById('save-quote-btn');
  if (saveQuoteBtn) {
    saveQuoteBtn.onclick = async () => {

      if (!text) {
        view.addQuoteError = 'יש לכתוב משפט לפני השמירה';

        return;

      try {
        await addDoc(collection(db, 'empowermentQuotes'), {

          createdAt: new Date().toISOString()
        });
        view.showAddQuote = false;

      }
      render();
    };

  const openRecipesBtn = document.getElementById('open-recipes-btn');
  if (openRecipesBtn) openRecipesBtn.onclick = () => {
    view.screen = 'recipes';

    view.addRecipeError = '';
    view.recipeDraft = { ingredients: [''], instructions: [''] };

  if (backFromRecipes) backFromRecipes.onclick = () => { view.screen = 'dashboard'; render(); };

  document.querySelectorAll('[data-toggle-category]').forEach(el => {
    el.onclick = () => {
      const cat = el.getAttribute('data-toggle-category');
      view.openRecipeCategories = view.openRecipeCategories || {};
      view.openRecipeCategories[cat] = !view.openRecipeCategories[cat];
      render();
    };
  });

  document.querySelectorAll('[data-toggle-recipe]').forEach(el => {
    el.onclick = (e) => {
      if (e.target.closest('[data-delete-recipe]')) return;
      const id = el.getAttribute('data-toggle-recipe');
      view.openRecipes = view.openRecipes || {};
      view.openRecipes[id] = !view.openRecipes[id];
      render();
    };
  });

  function syncRecipeDraftFromDom() {
    if (!view.recipeDraft) return;
    const titleEl = document.getElementById('recipe-title-input');
    const catEl = document.getElementById('recipe-category-input');
    const servEl = document.getElementById('recipe-servings-input');
    const prepEl = document.getElementById('recipe-preptime-input');
    const notesEl = document.getElementById('recipe-notes-input');
    if (titleEl) view.recipeDraft.title = titleEl.value;
    if (catEl) view.recipeDraft.category = catEl.value;
    if (servEl) view.recipeDraft.servings = servEl.value;
    if (prepEl) view.recipeDraft.prepTime = prepEl.value;
    if (notesEl) view.recipeDraft.notes = notesEl.value;
    document.querySelectorAll('.ing-input').forEach(el => {
      const i = parseInt(el.getAttribute('data-idx'), 10);
      view.recipeDraft.ingredients[i] = el.value;
    });
    document.querySelectorAll('.step-input').forEach(el => {
      const i = parseInt(el.getAttribute('data-idx'), 10);
      view.recipeDraft.instructions[i] = el.value;
    });
  }

  const toggleAddRecipeBtn = document.getElementById('toggle-add-recipe-btn');
  if (toggleAddRecipeBtn) toggleAddRecipeBtn.onclick = () => {
    view.showAddRecipe = !view.showAddRecipe;
    if (view.showAddRecipe) view.recipeDraft = { ingredients: [''], instructions: [''] };
    view.addRecipeError = '';
    render();
  };

  const addIngRowBtn = document.getElementById('add-ing-row-btn');
  if (addIngRowBtn) addIngRowBtn.onclick = () => {
    syncRecipeDraftFromDom();
    view.recipeDraft.ingredients.push('');
    render();
  };

  document.querySelectorAll('[data-remove-ing]').forEach(el => {
    el.onclick = () => {
      syncRecipeDraftFromDom();
      const i = parseInt(el.getAttribute('data-remove-ing'), 10);
      if (view.recipeDraft.ingredients.length > 1) view.recipeDraft.ingredients.splice(i, 1);
      render();
    };

  const addStepRowBtn = document.getElementById('add-step-row-btn');
  if (addStepRowBtn) addStepRowBtn.onclick = () => {
    syncRecipeDraftFromDom();
    view.recipeDraft.instructions.push('');
    render();
  };

    el.onclick = () => {
      syncRecipeDraftFromDom();
      const i = parseInt(el.getAttribute('data-remove-step'), 10);
      if (view.recipeDraft.instructions.length > 1) view.recipeDraft.instructions.splice(i, 1);
      render();
    };
  });

  const saveRecipeBtn = document.getElementById('save-recipe-btn');
  if (saveRecipeBtn) {
    saveRecipeBtn.onclick = async () => {
      syncRecipeDraftFromDom();
      const draft = view.recipeDraft;
      const title = (draft.title || '').trim();
      const category = (draft.category || '').trim();
      const servings = (draft.servings || '').trim();
      const prepTime = (draft.prepTime || '').trim();
      const notes = (draft.notes || '').trim();
      const ingredients = draft.ingredients.map(s => s.trim()).filter(Boolean);
      const instructions = draft.instructions.map(s => s.trim()).filter(Boolean);

      if (!title) {
        view.addRecipeError = 'יש להזין שם למתכון';
        render();
        return;
      }
      if (!category) {
        view.addRecipeError = 'יש לבחור או להזין קטגוריה';
        render();
        return;
      }
      if (!ingredients.length) {
        view.addRecipeError = 'יש להזין לפחות מרכיב אחד';
        render();
        return;
      }

      saveRecipeBtn.disabled = true;
      try {
        await addDoc(collection(db, 'recipes'), {
          title, category, servings, prepTime, notes,
          ingredients, instructions,
          addedBy: session.name,
          createdAt: new Date().toISOString()
        });
        await setDoc(doc(db, 'recipeCategories', category), {
          name: category,
          addedBy: session.name,
          createdAt: new Date().toISOString()

        view.showAddRecipe = false;
        view.addRecipeError = '';
        view.recipeDraft = { ingredients: [''], instructions: [''] };

        view.addRecipeError = 'שגיאה בשמירת המתכון, נסי שוב';

      render();
    };

  document.querySelectorAll('[data-delete-recipe]').forEach(el => {
    el.onclick = async (e) => {
      e.stopPropagation();
      const id = el.getAttribute('data-delete-recipe');

      }

  const jokeFabBtn = document.getElementById('joke-fab-btn');

    view.jokePopup = { index: Math.floor(Math.random() * JOKES.length) };

  const jokeCloseBtn = document.getElementById('joke-close-btn');

      }
    };

  const empowerFabBtn = document.getElementById('empower-fab-btn');

      shoppingAddBtn.disabled = true;

        await addDoc(collection(db, 'shoppingList'), {
          text,
          addedBy: session.name,
          createdAt: new Date().toISOString(),
          purchased: false,
          purchasedBy: null,
          purchasedAt: null
        });

        alert('שגיאה בהוספת הפריט, נסי שוב');

      shoppingAddBtn.disabled = false;
    };
    const shoppingItemInput = document.getElementById('shopping-item-input');
    if (shoppingItemInput) shoppingItemInput.onkeydown = (e) => { if (e.key === 'Enter') shoppingAddBtn.click(); };
  }

  document.querySelectorAll('[data-toggle-purchased]').forEach(el => {
    el.onclick = async () => {
      const id = el.getAttribute('data-toggle-purchased');
      const currentlyPurchased = el.getAttribute('data-currently') === '1';
      try {
        await setDoc(doc(db, 'shoppingList', id), currentlyPurchased
          ? { purchased: false, purchasedBy: null, purchasedAt: null }
          : { purchased: true, purchasedBy: session.name, purchasedAt: new Date().toISOString() }
        , { merge: true });
      } catch (e) {
        alert('שגיאה בעדכון הפריט, נסי שוב');
      }
    };

  document.querySelectorAll('[data-delete-shopping]').forEach(el => {
    el.onclick = async () => {
      const id = el.getAttribute('data-delete-shopping');
      try {
        await deleteDoc(doc(db, 'shoppingList', id));
      } catch (e) {
        alert('שגיאה במחיקת הפריט');
      }
    };
  });
}

function subscribeAll(name, gen) {
  const loadedKeys = new Set();

  const checkLoaded = () => {
    if (gen !== authGeneration) return;
    if (loadedKeys.size >= 10 && view.screen === 'loading') {
      finishInitialLoad(name);
    } else {
      render();
    }
  };

  unsubscribers.push(onSnapshot(collection(db, 'transactions'), snap => {
    if (gen !== authGeneration) return;
    data.transactions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loadedKeys.add('transactions');
    checkLoaded();
  }, () => {}));

  unsubscribers.push(onSnapshot(collection(db, 'activityLog'), snap => {
    if (gen !== authGeneration) return;
    data.activityLog = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loadedKeys.add('activityLog');
    checkLoaded();
  }, () => {}));

  unsubscribers.push(onSnapshot(collection(db, 'sharedNotes'), snap => {
    if (gen !== authGeneration) return;
    data.sharedNotesFlat = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loadedKeys.add('sharedNotes');
    checkLoaded();
  }, () => {}));

  unsubscribers.push(onSnapshot(query(collection(db, 'personalNotes'), where('owner', '==', name)), snap => {
    if (gen !== authGeneration) return;
    data.personalNotesFlat = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loadedKeys.add('personalNotes');
    checkLoaded();
  }, () => {}));

  unsubscribers.push(onSnapshot(doc(db, 'userState', name), snap => {
    if (gen !== authGeneration) return;
    data.userState = snap.exists() ? { notesReadStatus: {}, txSeenStatus: {}, ...snap.data() } : { notesReadStatus: {}, txSeenStatus: {} };
    loadedKeys.add('userState');
    checkLoaded();
  }, () => {}));

  unsubscribers.push(onSnapshot(collection(db, 'empowermentQuotes'), snap => {
    if (gen !== authGeneration) return;
    data.empowermentQuotes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loadedKeys.add('empowermentQuotes');
    checkLoaded();
  }, () => {
    // Non-critical collection: don't let a permission/rules hiccup here block the whole app from loading.
    loadedKeys.add('empowermentQuotes');
    checkLoaded();
  }));

  unsubscribers.push(onSnapshot(collection(db, 'recipes'), snap => {
    if (gen !== authGeneration) return;
    data.recipes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loadedKeys.add('recipes');
    checkLoaded();
  }, () => {
    loadedKeys.add('recipes');
    checkLoaded();
  }));

  unsubscribers.push(onSnapshot(collection(db, 'recipeCategories'), snap => {
    if (gen !== authGeneration) return;
    data.recipeCategories = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loadedKeys.add('recipeCategories');
    checkLoaded();
  }, () => {
    loadedKeys.add('recipeCategories');
    checkLoaded();
  }));

  unsubscribers.push(onSnapshot(collection(db, 'jokeRatings'), snap => {
    if (gen !== authGeneration) return;
    data.jokeRatings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loadedKeys.add('jokeRatings');
    checkLoaded();
  }, () => {
    loadedKeys.add('jokeRatings');
    checkLoaded();
  }));

  unsubscribers.push(onSnapshot(collection(db, 'shoppingList'), snap => {
    if (gen !== authGeneration) return;
    data.shoppingList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loadedKeys.add('shoppingList');
    checkLoaded();
  }, () => {
    loadedKeys.add('shoppingList');
    checkLoaded();
  }));
}

function finishInitialLoad(me) {
  const pet = pickPetName();
  const seenMap = data.userState.txSeenStatus || {};
  const unseenTx = data.transactions.filter(tx =>
    (tx.payer === me || tx.payee === me) && tx.enteredBy !== me && !seenMap[tx.id]
  );
  const notifications = unseenTx.map(tx => buildTxNotificationText(tx, me, pet));
  if (unseenTx.length) {
    Promise.all(unseenTx.map(tx => markTxSeen(me, tx.id))).catch(() => {});
  }
  const quote = pickRandomQuote();
  view = {
    screen: 'dashboard',
    loginPopup: { greeting: `${getLoginGreetingBase()}, ${me} ${pet}!`, notifications, quote }
  };
  render();
}

onAuthStateChanged(auth, async (user) => {
  if (suppressAuthUI) return;
  const gen = ++authGeneration;
  unsubscribeAll();

  if (!user) {
    session = null;
    view = { screen: 'login', selectedName: null, loginError: '' };
    render();
    return;
  }

  const name = EMAIL_TO_NAME[user.email];
  if (!name) {
    await signOut(auth);
    return;
  }

  session = { name };
  view = { screen: 'loading' };
  render();
  subscribeAll(name, gen);
});

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
